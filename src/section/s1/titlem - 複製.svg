<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a2639"/>
      <stop offset="100%" stop-color="#0b101a"/>
    </radialGradient>

    <!-- 鑽石主體藍色漸層 -->
    <linearGradient id="diamondBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="50%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>

    <!-- 鑽石刻面亮部漸層 -->
    <linearGradient id="facetLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e3f2fd" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 星芒發光漸層 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#b3e5fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b3e5fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深色背景 -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- 動態群組：整體鑽石微弱呼吸縮放 -->
  <g transform="translate(0, 0)">
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="1; 1.02; 1" 
      keyTimes="0; 0.5; 1" 
      dur="4s" 
      repeatCount="indefinite" 
      additive="sum"
      pivot="200, 200"
    />

    <!-- ==================== 鑽石本體 ==================== -->
    <g stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- 底層與背面刻面（暗部） -->
      <polygon points="200,120 250,150 200,280" fill="#1e88e5" />
      <polygon points="200,120 150,150 200,280" fill="#1565c0" />
      
      <!-- 正面主要刻面 -->
      <polygon points="150,150 250,150 200,280" fill="url(#diamondBlue)" />
      
      <!-- 鑽石冠部（頂部切面） -->
      <polygon points="150,150 175,120 225,120 250,150" fill="url(#facetLight)" />
      <polygon points="175,120 225,120 200,150" fill="#ffffff" opacity="0.8" />
      <polygon points="150,150 175,120 200,150" fill="#bbdefb" />
      <polygon points="250,150 225,120 200,150" fill="#e3f2fd" />
    </g>

    <!-- ==================== 鑽石表面反光動畫 ==================== -->
    <polygon points="150,150 250,150 200,280" fill="#ffffff" opacity="0">
      <animate 
        attributeName="opacity" 
        values="0; 0.4; 0" 
        keyTimes="0; 0.3; 1" 
        dur="2.5s" 
        repeatCount="indefinite" 
      />
    </polygon>
  </g>

  <!-- ==================== 動態閃爍星芒 ==================== -->
  <!-- 星芒一：右上角 -->
  <g transform="translate(240, 130)">
    <circle cx="0" cy="0" r="15" fill="url(#glow)"/>
    <path d="M 0,-25 Q 0,0 25,0 Q 0,0 0,25 Q 0,0 -25,0 Q 0,0 0,-25 Z" fill="#ffffff"/>
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="0; 1; 0" 
      keyTimes="0; 0.4; 0.8" 
      dur="2s" 
      repeatCount="indefinite" 
      additive="sum"
    />
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="0; 90" 
      dur="2s" 
      repeatCount="indefinite" 
      additive="sum"
    />
  </g>

  <!-- 星芒二：左下角（交錯時間閃爍） -->
  <g transform="translate(160, 220)">
    <circle cx="0" cy="0" r="10" fill="url(#glow)"/>
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#ffffff"/>
    <animateTransform 
      attributeName="transform" 
      type="scale" 
      values="0; 1.2; 0" 
      keyTimes="0; 0.5; 1" 
      dur="2.8s" 
      begin="0.8s"
      repeatCount="indefinite" 
      additive="sum"
    />
  </g>

  <!-- 星芒三：頂部微弱光點 -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="8" fill="url(#glow)"/>
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#ffffff"/>
    <animate transform="attributeName=opacity" values="0.2; 1; 0.2" dur="1.5s" repeatCount="indefinite"/>
  </g>
</svg>
