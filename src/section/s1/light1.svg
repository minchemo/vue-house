<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400"
preserveAspectRatio="xMidYMid slice">
   <defs>
    <linearGradient id="light" y1="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff0"/>
    <animate dur="3s" attributeName="x1" repeatCount="indefinite" from="-700" to="2000"/>
    <animate dur="3s" attributeName="x2" repeatCount="indefinite" from="-400" to="2300"/>
    </linearGradient>
  </defs>
  <rect fill="url(#light)" y="0" width="400" height="400"/>
</svg>